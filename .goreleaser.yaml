# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: cless

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: cless
    main: ./cmd/organizer
    binary: cless
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Fizm00/organizer/internal/version.Version={{.Version}}
      - -X github.com/Fizm00/organizer/internal/version.Commit={{.Commit}}
      - -X github.com/Fizm00/organizer/internal/version.BuildDate={{.Date}}

archives:
  - id: cless-archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - docs/AUTOSTART.md
      - cless.example.yaml

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: Fizm00
    name: ClutterLess-Organizer
  mode: replace
