<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .glow-bg { animation: pulseGlow 6s ease-in-out infinite; }
      .floating { animation: floatIcon 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="876" height="196" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="876" height="196" rx="16" fill="url(#glow)" class="glow-bg" />

  <!-- Subtle grid dots pattern -->
  <g opacity="0.08" fill="#94a3b8">
    <circle cx="80" cy="40" r="1.5" /><circle cx="120" cy="40" r="1.5" /><circle cx="160" cy="40" r="1.5" />
    <circle cx="80" cy="80" r="1.5" /><circle cx="120" cy="80" r="1.5" /><circle cx="160" cy="80" r="1.5" />
    <circle cx="80" cy="120" r="1.5" /><circle cx="120" cy="120" r="1.5" /><circle cx="160" cy="120" r="1.5" />
    <circle cx="80" cy="160" r="1.5" /><circle cx="120" cy="160" r="1.5" /><circle cx="160" cy="160" r="1.5" />
    <circle cx="720" cy="40" r="1.5" /><circle cx="760" cy="40" r="1.5" /><circle cx="800" cy="40" r="1.5" />
    <circle cx="720" cy="80" r="1.5" /><circle cx="760" cy="80" r="1.5" /><circle cx="800" cy="80" r="1.5" />
    <circle cx="720" cy="120" r="1.5" /><circle cx="760" cy="120" r="1.5" /><circle cx="800" cy="120" r="1.5" />
    <circle cx="720" cy="160" r="1.5" /><circle cx="760" cy="160" r="1.5" /><circle cx="800" cy="160" r="1.5" />
  </g>

  <!-- Release Pill Badge -->
  <g transform="translate(48, 32)">
    <rect width="168" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">RELEASE v0.3.0</text>
    <text x="116" y="17" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">STABLE</text>
  </g>

  <!-- Title -->
  <text x="48" y="106" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.8">ClutterLess Organizer</text>
  <text x="450" y="106" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="28" font-weight="600">cless</text>

  <!-- Subtitle -->
  <text x="48" y="142" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
    High-performance local file organizer &amp; background daemon with deterministic routing and atomic rollback.
  </text>

  <!-- Feature Chips -->
  <g transform="translate(48, 160)">
    <text x="0" y="16" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Zero Overwrites</text>
    <text x="120" y="16" fill="#475569" font-family="sans-serif" font-size="12">•</text>
    <text x="135" y="16" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Real-Time Watcher</text>
    <text x="282" y="16" fill="#475569" font-family="sans-serif" font-size="12">•</text>
    <text x="297" y="16" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Instant Undo</text>
    <text x="397" y="16" fill="#475569" font-family="sans-serif" font-size="12">•</text>
    <text x="412" y="16" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">11 File Categories</text>
    <text x="548" y="16" fill="#475569" font-family="sans-serif" font-size="12">•</text>
    <text x="563" y="16" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Cross-Platform</text>
  </g>
</svg>
