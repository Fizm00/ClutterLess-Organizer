text{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
.art{font-size:18px;fill:var(--ink);font-weight:500}
@keyframes w0{0%{width:0}3.889%{width:0}15.0%{width:682.0px}100%{width:682.0px}}.w0{animation:w0 9.0s cubic-bezier(.3,.6,.3,1) infinite}@keyframes w1{0%{width:0}5.444%{width:0}16.556%{width:682.0px}100%{width:682.0px}}.w1{animation:w1 9.0s cubic-bezier(.3,.6,.3,1) infinite}@keyframes w2{0%{width:0}7.0%{width:0}18.111%{width:682.0px}100%{width:682.0px}}.w2{animation:w2 9.0s cubic-bezier(.3,.6,.3,1) infinite}@keyframes w3{0%{width:0}8.556%{width:0}19.667%{width:682.0px}100%{width:682.0px}}.w3{animation:w3 9.0s cubic-bezier(.3,.6,.3,1) infinite}@keyframes w4{0%{width:0}10.111%{width:0}21.222%{width:682.0px}100%{width:682.0px}}.w4{animation:w4 9.0s cubic-bezier(.3,.6,.3,1) infinite}@keyframes w5{0%{width:0}11.667%{width:0}22.778%{width:682.0px}100%{width:682.0px}}.w5{animation:w5 9.0s cubic-bezier(.3,.6,.3,1) infinite}
.tag{animation:tg 9.0s linear infinite;opacity:0}
@keyframes tg{0%{opacity:0}20.0%{opacity:0}27.778%{opacity:1}100%{opacity:1}}
.all{animation:al 9.0s linear infinite}
@keyframes al{0%{opacity:1}91.111%{opacity:1}97.778%{opacity:0}100%{opacity:0}}
.cur{animation:bl 1.1s steps(1) infinite}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
