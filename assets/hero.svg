<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="t d">
<title id="t">ClutterLess Organizer</title>
<desc id="d">ClutterLess wordmark in ASCII art, printed line by line.</desc>
<style>
:root{--ink:#0891b2;--sub:#57606a;--dim:#8c959f}
