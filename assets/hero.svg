<g class="all">
<g class="art"><text clip-path="url(#c0)" x="39.0" y="52" textLength="682.0" lengthAdjust="spacing" xml:space="preserve">  ____  _         _    _                _                     </text><text clip-path="url(#c1)" x="39.0" y="75" textLength="682.0" lengthAdjust="spacing" xml:space="preserve"> / ___|| | _   _ | |_ | |_   ___  _ __ | |      ___  ___  ___ </text><text clip-path="url(#c2)" x="39.0" y="98" textLength="682.0" lengthAdjust="spacing" xml:space="preserve">| |    | || | | || __|| __| / _ \| '__|| |     / _ \/ __|/ __|</text><text clip-path="url(#c3)" x="39.0" y="121" textLength="682.0" lengthAdjust="spacing" xml:space="preserve">| |___ | || |_| || |_ | |_ |  __/| |   | |___ |  __/\__ \\__ \</text><text clip-path="url(#c4)" x="39.0" y="144" textLength="682.0" lengthAdjust="spacing" xml:space="preserve"> \____||_| \__,_| \__| \__| \___||_|   |_____| \___||___/|___/</text><text clip-path="url(#c5)" x="39.0" y="167" textLength="682.0" lengthAdjust="spacing" xml:space="preserve">                                                              </text></g>
<g class="tag">
<text x="380.0" y="220" text-anchor="middle" font-size="14.5" style="fill:var(--sub)">Deterministic local file organizer &amp; filesystem automator</text>
<text x="379.0" y="248" text-anchor="middle" font-size="12.5" style="fill:var(--dim)"><tspan style="fill:var(--ink)">$</tspan> cless run  ·  cless watch  ·  cless undo</text>
</g></g>
