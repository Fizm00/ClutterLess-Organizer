<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="430" fill="none">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes lineFade {
        0% { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes loopCycle {
        0%, 10% { opacity: 0; }
        15%, 88% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }

      .term-body {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 20px;
      }
      .cursor {
        animation: blink 1s infinite;
      }

      /* Staggered animation */
      .anim-container {
        animation: loopCycle 12s infinite;
      }
      .line-1 { animation: lineFade 0.4s ease forwards; animation-delay: 0.2s; opacity: 0; }
      .line-2 { animation: lineFade 0.4s ease forwards; animation-delay: 0.8s; opacity: 0; }
      .line-3 { animation: lineFade 0.3s ease forwards; animation-delay: 1.3s; opacity: 0; }
      .line-4 { animation: lineFade 0.3s ease forwards; animation-delay: 1.6s; opacity: 0; }
      .line-5 { animation: lineFade 0.3s ease forwards; animation-delay: 1.9s; opacity: 0; }
      .line-6 { animation: lineFade 0.3s ease forwards; animation-delay: 2.2s; opacity: 0; }
      .line-7 { animation: lineFade 0.3s ease forwards; animation-delay: 2.5s; opacity: 0; }
      .line-8 { animation: lineFade 0.3s ease forwards; animation-delay: 2.8s; opacity: 0; }
      .summary-box { animation: lineFade 0.5s ease forwards; animation-delay: 3.3s; opacity: 0; }
      .prompt-end  { animation: lineFade 0.3s ease forwards; animation-delay: 3.8s; opacity: 0; }
    </style>

    <linearGradient id="termBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="876" height="426" rx="10" fill="#090d16" stroke="url(#termBorder)" stroke-width="1.5" />

  <!-- Terminal Header Bar -->
  <path d="M 3 3 Q 3 3 12 3 L 868 3 Q 877 3 877 12 L 877 36 L 3 36 Z" fill="#131926" />
  <line x1="3" y1="36" x2="877" y2="36" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="42" cy="19" r="6" fill="#f59e0b" />
  <circle cx="62" cy="19" r="6" fill="#10b981" />

  <!-- Terminal Title -->
  <text x="440" y="23" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" text-anchor="middle">cless ~ terminal preview</text>

  <!-- Terminal Content -->
  <g class="term-body anim-container" transform="translate(24, 64)">
    <!-- Command Line -->
    <g class="line-1">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">~</text>
      <text x="14" y="0" fill="#64748b">&gt;</text>
      <text x="32" y="0" fill="#f1f5f9" font-weight="600">cless run --dry-run</text>
    </g>

    <!-- Scan Info -->
    <g class="line-2" transform="translate(0, 24)">
      <text x="0" y="0" fill="#38bdf8">Scanning ~/Downloads...</text>
      <text x="180" y="0" fill="#64748b">found 12 files to organize</text>
    </g>

    <!-- Dry Run Entries -->
    <g class="line-3" transform="translate(0, 52)">
      <text x="0" y="0" fill="#f59e0b" font-weight="700">[DRY-RUN]</text>
      <text x="80" y="0" fill="#e2e8f0">invoice_2026_04.pdf</text>
      <text x="280" y="0" fill="#64748b">-&gt;</text>
      <text x="306" y="0" fill="#38bdf8">Documents/Finance/2026-04/invoice_2026_04.pdf</text>
      <text x="710" y="0" fill="#64748b">(Invoices)</text>
    </g>

    <g class="line-4" transform="translate(0, 74)">
      <text x="0" y="0" fill="#f59e0b" font-weight="700">[DRY-RUN]</text>
      <text x="80" y="0" fill="#e2e8f0">design_render.png</text>
      <text x="280" y="0" fill="#64748b">-&gt;</text>
      <text x="306" y="0" fill="#38bdf8">Pictures/Sorted/2026/design_render.png</text>
      <text x="710" y="0" fill="#64748b">(Images)</text>
    </g>

    <g class="line-5" transform="translate(0, 96)">
      <text x="0" y="0" fill="#f59e0b" font-weight="700">[DRY-RUN]</text>
      <text x="80" y="0" fill="#e2e8f0">screencast.mp4</text>
      <text x="280" y="0" fill="#64748b">-&gt;</text>
      <text x="306" y="0" fill="#38bdf8">Videos/Sorted/2026/screencast.mp4</text>
      <text x="710" y="0" fill="#64748b">(Videos)</text>
    </g>

    <g class="line-6" transform="translate(0, 118)">
      <text x="0" y="0" fill="#f59e0b" font-weight="700">[DRY-RUN]</text>
      <text x="80" y="0" fill="#e2e8f0">backup_archive.tar.gz</text>
      <text x="280" y="0" fill="#64748b">-&gt;</text>
      <text x="306" y="0" fill="#38bdf8">Downloads/_Archives/backup_archive.tar.gz</text>
      <text x="710" y="0" fill="#64748b">(Archives)</text>
    </g>

    <g class="line-7" transform="translate(0, 140)">
      <text x="0" y="0" fill="#f59e0b" font-weight="700">[DRY-RUN]</text>
      <text x="80" y="0" fill="#e2e8f0">setup_node_v22.msi</text>
      <text x="280" y="0" fill="#64748b">-&gt;</text>
      <text x="306" y="0" fill="#38bdf8">Downloads/_Installers/setup_node_v22.msi</text>
      <text x="710" y="0" fill="#64748b">(Installers)</text>
    </g>

    <g class="line-8" transform="translate(0, 162)">
      <text x="0" y="0" fill="#f59e0b" font-weight="700">[DRY-RUN]</text>
      <text x="80" y="0" fill="#e2e8f0">database_dump.sql</text>
      <text x="280" y="0" fill="#64748b">-&gt;</text>
      <text x="306" y="0" fill="#38bdf8">Documents/Data/sql/database_dump.sql</text>
      <text x="710" y="0" fill="#64748b">(Data)</text>
    </g>

    <!-- Execution Summary Box -->
    <g class="summary-box" transform="translate(0, 198)">
      <rect x="0" y="0" width="830" height="110" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="18" y="24" fill="#38bdf8" font-weight="700">Execution Summary</text>
      <text x="160" y="24" fill="#64748b">| Dry-Run Mode (No files modified)</text>

      <text x="18" y="48" fill="#94a3b8">Duration:</text>
      <text x="110" y="48" fill="#f1f5f9" font-weight="600">8.4ms</text>

      <text x="18" y="70" fill="#94a3b8">Planned:</text>
      <text x="110" y="70" fill="#10b981" font-weight="600">6 files</text>
      <text x="190" y="70" fill="#94a3b8">Skipped:</text>
      <text x="260" y="70" fill="#f59e0b">2 active downloads (.crdownload)</text>

      <text x="18" y="92" fill="#94a3b8">Integrity:</text>
      <text x="110" y="92" fill="#38bdf8">100% collision-free (zero overwrites guaranteed)</text>
    </g>

    <!-- Ready Prompt -->
    <g class="prompt-end" transform="translate(0, 332)">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">~</text>
      <text x="14" y="0" fill="#64748b">&gt;</text>
      <text x="32" y="0" fill="#10b981" font-weight="600">cless run</text>
      <text x="115" y="0" fill="#38bdf8" class="cursor">▋</text>
    </g>
  </g>
</svg>
