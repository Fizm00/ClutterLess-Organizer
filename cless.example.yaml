# ClutterLess Organizer (cless) - Example Configuration File
# Copy to the default configuration location:
#   Windows: %APPDATA%\organizer\config.yaml
#   Linux:   ~/.config/organizer/config.yaml
#   macOS:   ~/Library/Application Support/organizer/config.yaml

version: 1

settings:
  stable_after_seconds: 3
  ignore_ext:
    - crdownload
    - part
    - tmp
    - download
    - partial
    - opdownload
    - lnk
    - url
  ignore_names:
    - desktop.ini
    - thumbs.db
    - .DS_Store
  ignore_hidden: true
  conflict: rename
  fallback_dir: ""

watch:
  - path: ~/Downloads
    recursive: false
  # Add more folders if desired, e.g.:
  # - path: ~/Desktop
  #   recursive: false

rules:
  - name: Invoices
    match:
      name_regex: "(?i)(invoice|faktur|receipt|kwitansi|struk|bukti.transfer|pembayaran|tagihan)"
    move_to: ~/Documents/Finance/{year}-{month}

  - name: Images
    match:
      ext:
        - jpg
        - jpeg
        - png
        - gif
        - webp
        - bmp
        - svg
        - ico
        - tiff
        - tif
        - heic
    move_to: ~/Pictures/Sorted/{year}

  - name: Videos
    match:
      ext:
        - mp4
        - mkv
        - mov
        - avi
        - wmv
        - flv
        - webm
        - m4v
    move_to: ~/Videos/Sorted/{year}

  - name: Audio
    match:
      ext:
        - mp3
        - wav
        - flac
        - aac
        - ogg
        - m4a
        - wma
        - opus
    move_to: ~/Music/Sorted/{year}

  - name: Documents
    match:
      ext:
        - pdf
        - docx
        - doc
        - xlsx
        - xls
        - pptx
        - ppt
        - txt
        - md
        - rtf
        - odt
        - ods
        - odp
        - csv
        - tsv
    move_to: ~/Documents/Inbox/{ext}

  - name: Books
    match:
      ext:
        - epub
        - mobi
        - azw3
        - djvu
        - cbr
        - cbz
    move_to: ~/Documents/Books

  - name: Data
    match:
      ext:
        - json
        - xml
        - yaml
        - yml
        - toml
        - sql
        - sqlite
        - db
    move_to: ~/Documents/Data/{ext}

  - name: Creative
    match:
      ext:
        - blend
        - fbx
        - obj
        - stl
        - gltf
        - glb
        - dae
        - 3ds
        - psd
        - ai
        - xd
        - fig
    move_to: ~/Documents/Creative_Assets

  - name: Installers
    match:
      ext:
        - exe
        - msi
        - dmg
        - deb
        - pkg
        - rpm
        - appimage
        - apk
        - iso
    move_to: ~/Downloads/_Installers

  - name: Archives
    match:
      ext:
        - zip
        - rar
        - 7z
        - tar
        - gz
        - bz2
        - xz
        - tgz
    move_to: ~/Downloads/_Archives

  - name: Old stuff
    match:
      older_than: 90d
    move_to: ~/Downloads/_Old
