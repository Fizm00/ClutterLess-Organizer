name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Release CLI (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Clean existing release if re-running
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release delete "${TAG_NAME}" --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-gui-windows:
    name: Release GUI (Windows Installer & Portable)
    needs: goreleaser
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'cmd/cless-gui/frontend/package-lock.json'

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build frontend
        run: |
          npm --prefix cmd/cless-gui/frontend ci
          npm --prefix cmd/cless-gui/frontend run build

      - name: Install Wails v3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Generate Windows syso and WebView2 bootstrapper
        shell: bash
        run: |
          wails3 generate syso -arch amd64 -icon cmd/cless-gui/build/windows/icon.ico -manifest cmd/cless-gui/build/windows/wails.exe.manifest -info cmd/cless-gui/build/windows/info.json -out cmd/cless-gui/wails_windows_amd64.syso
          wails3 generate webview2bootstrapper -dir cmd/cless-gui/build/windows/nsis

      - name: Build GUI executable
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          mkdir -p bin dist cmd/cless-gui/bin
          go build -tags production -trimpath -ldflags "-s -w -H windowsgui -X github.com/Fizm00/organizer/internal/version.Version=${VERSION} -X github.com/Fizm00/organizer/internal/version.Commit=${{ github.sha }} -X github.com/Fizm00/organizer/internal/version.BuildDate=$(date -u +%Y-%m-%d)" -o bin/cless-gui.exe ./cmd/cless-gui

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $TAG_NAME = $env:GITHUB_REF -replace '^refs/tags/', ''
          $VERSION = $TAG_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist, bin, cmd/cless-gui/bin | Out-Null
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) {
              $makensis = "makensis"
          }
          Push-Location cmd/cless-gui/build/windows/nsis
          & $makensis /V4 project.nsi
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) {
              throw "makensis failed with exit code $code"
          }
          Copy-Item "dist/cless-gui-installer.exe" "dist/cless-gui_${VERSION}_windows_amd64_installer.exe"
          Get-Item dist/*

      - name: Package Portable Windows Zip
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          7z a "dist/cless-gui_${VERSION}_windows_amd64.zip" ./bin/cless-gui.exe ./README.md ./LICENSE ./docs/AUTOSTART.md

      - name: Generate Checksums
        shell: bash
        working-directory: dist
        run: |
          sha256sum cless-gui_* > checksums-windows-gui.txt

      - name: Upload Windows GUI Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cless-gui_*_windows_amd64_installer.exe
            dist/cless-gui_*_windows_amd64.zip
            dist/checksums-windows-gui.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-gui-linux:
    name: Release GUI (Linux Archive)
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'cmd/cless-gui/frontend/package-lock.json'

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build frontend
        run: |
          npm --prefix cmd/cless-gui/frontend ci
          npm --prefix cmd/cless-gui/frontend run build

      - name: Build GUI executable
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          mkdir -p bin dist
          CGO_ENABLED=1 go build -tags production -trimpath -ldflags "-s -w -X github.com/Fizm00/organizer/internal/version.Version=${VERSION} -X github.com/Fizm00/organizer/internal/version.Commit=${{ github.sha }} -X github.com/Fizm00/organizer/internal/version.BuildDate=$(date -u +%Y-%m-%d)" -o bin/cless-gui ./cmd/cless-gui

      - name: Package Linux Archive
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          mkdir -p dist/staging-linux
          cp bin/cless-gui LICENSE README.md cmd/cless-gui/build/linux/desktop cmd/cless-gui/build/appicon.png dist/staging-linux/
          tar -czvf "dist/cless-gui_${VERSION}_linux_amd64.tar.gz" -C dist/staging-linux .

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum cless-gui_* > checksums-linux-gui.txt

      - name: Upload Linux GUI Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cless-gui_*_linux_amd64.tar.gz
            dist/checksums-linux-gui.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-gui-macos:
    name: Release GUI (macOS Archive)
    needs: goreleaser
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'cmd/cless-gui/frontend/package-lock.json'

      - name: Build frontend
        run: |
          npm --prefix cmd/cless-gui/frontend ci
          npm --prefix cmd/cless-gui/frontend run build

      - name: Build GUI executables (amd64 and arm64)
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          mkdir -p bin dist
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -tags production -trimpath -ldflags "-s -w -X github.com/Fizm00/organizer/internal/version.Version=${VERSION} -X github.com/Fizm00/organizer/internal/version.Commit=${{ github.sha }} -X github.com/Fizm00/organizer/internal/version.BuildDate=$(date -u +%Y-%m-%d)" -o bin/cless-gui-arm64 ./cmd/cless-gui
          CGO_ENABLED=1 CGO_CFLAGS="-target x86_64-apple-macos10.13" CGO_LDFLAGS="-target x86_64-apple-macos10.13" GOOS=darwin GOARCH=amd64 go build -tags production -trimpath -ldflags "-s -w -X github.com/Fizm00/organizer/internal/version.Version=${VERSION} -X github.com/Fizm00/organizer/internal/version.Commit=${{ github.sha }} -X github.com/Fizm00/organizer/internal/version.BuildDate=$(date -u +%Y-%m-%d)" -o bin/cless-gui-amd64 ./cmd/cless-gui

      - name: Package macOS Archives
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          mkdir -p dist/staging-macos-arm64 dist/staging-macos-amd64
          cp bin/cless-gui-arm64 dist/staging-macos-arm64/cless-gui
          cp LICENSE README.md dist/staging-macos-arm64/
          tar -czvf "dist/cless-gui_${VERSION}_darwin_arm64.tar.gz" -C dist/staging-macos-arm64 .

          cp bin/cless-gui-amd64 dist/staging-macos-amd64/cless-gui
          cp LICENSE README.md dist/staging-macos-amd64/
          tar -czvf "dist/cless-gui_${VERSION}_darwin_amd64.tar.gz" -C dist/staging-macos-amd64 .

      - name: Generate Checksums
        working-directory: dist
        run: |
          shasum -a 256 cless-gui_* > checksums-darwin-gui.txt

      - name: Upload macOS GUI Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cless-gui_*_darwin_*.tar.gz
            dist/checksums-darwin-gui.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
